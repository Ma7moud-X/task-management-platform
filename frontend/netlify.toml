[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NETLIFY = "true"
  NODE_VERSION = "18"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  # Removed catch-all redirect. This redirect served index.html for all paths
  # and prevented Netlify from handling Next.js server functions and API
  # routes. Next.js plugin will handle routing and server functions.

[[plugins]]
  package = "@netlify/plugin-nextjs"