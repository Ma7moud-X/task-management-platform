[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Mahmoud <mahmoud.elngar.2510@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = ">=0.119.0,<0.120.0"
uvicorn = {extras = ["standard"], version = ">=0.37.0,<0.38.0"}
sqlalchemy = ">=2.0.44,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.17.0,<2.0.0"
pydantic-settings = ">=2.11.0,<3.0.0"
pydantic = {extras = ["email"], version = ">=2.12.0,<3.0.0"}
passlib = {extras = ["argon2"], version = ">=1.7.4,<2.0.0"}
pyjwt = {extras = ["crypto"], version = ">=2.10.1,<3.0.0"}
redis = {extras = ["async"], version = ">=6.4.0,<7.0.0"}
celery = "^5.5.3"
python-dotenv = "^1.1.1"
requests = "^2.32.5"
brevo-python = "^1.2.0"
python-json-logger = "^2.0.7"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
